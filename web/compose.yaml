services:
  app:
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?set STRIPE_WEBHOOK_SECRET}
      PRICE_PER_VIDEO_USD: ${PRICE_PER_VIDEO_USD:-0.50}
      CURRENCY: ${CURRENCY:-usd}
      DATABASE_PATH: /data/yt-transcribe.db
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data: